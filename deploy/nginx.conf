# nginx site config for the websfm static build (replaces the stock
# /etc/nginx/conf.d/default.conf). Encodes the four host requirements from
# README.md "Deploying"; the stock config satisfies none of them.
#
# add_header inheritance note: a location that declares its own `add_header`
# DROPS every add_header inherited from the server block. Cache-Control below is
# therefore set with `expires` (a separate mechanism) so the two cross-origin
# isolation headers survive into every location.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation → SharedArrayBuffer → multi-threaded ONNX Runtime
    # (~3× on matching). COEP `credentialless`, not `require-corp`, so the
    # OpenLayers basemap tiles still load. See vite.config.js for the matching
    # dev-server headers. Safari ignores credentialless and stays single-threaded.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy credentialless always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json image/svg+xml;
    # .wasm and .onnx are excluded on purpose: they are large and compress
    # slowly per request, and streaming compilation prefers them untouched.

    # ONNX Runtime dynamically imports its wasm loader as an ES module. nginx's
    # stock mime.types has no entry for .mjs, so it would be served as
    # application/octet-stream and strict MIME checking refuses the import.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
    }

    # Correct type enables streaming compilation (wasm-bindgen falls back to a
    # buffered instantiate otherwise, so this is speed rather than correctness).
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
        expires 1y;
    }

    location ~ \.onnx$ {
        types { }
        default_type application/octet-stream;
        expires 1y;
    }

    # Content-hashed filenames — safe to pin. `expires` also emits the
    # immutable-equivalent max-age without resetting the headers above.
    location /assets/ {
        expires 1y;
    }

    # Must revalidate, or a release cannot point browsers at its new hashes.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
