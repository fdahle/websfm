  <text x="170" y="40" fill="#c9d1d9" font-size="13" text-anchor="middle">sparse cloud: tie points</text>
  <text x="530" y="40" fill="#c9d1d9" font-size="13" text-anchor="middle">dense cloud</text>
  <text x="170" y="292" fill="#9ca3af" font-size="11" text-anchor="middle">one point per matched feature, each with its track</text>
  <text x="170" y="308" fill="#e6b84f" font-size="11" text-anchor="middle">thousands to a few hundred thousand points</text>
  <text x="530" y="292" fill="#9ca3af" font-size="11" text-anchor="middle">a point for nearly every pixel, fused from depth maps</text>
  <text x="530" y="308" fill="#e6b84f" font-size="11" text-anchor="middle">millions to tens of millions of points</text>
  <text x="90" y="74" fill="#5aa9e6" font-size="11">its track</text>
