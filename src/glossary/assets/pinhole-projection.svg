<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="sans-serif" font-size="13">
  <rect width="640" height="320" fill="#1b1f27"/>
  <line x1="110" y1="190" x2="620" y2="190" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="600" y="182" fill="#9ca3af" font-size="11" text-anchor="end">optical axis</text>
  <line x1="270" y1="60" x2="270" y2="300" stroke="#c9d1d9" stroke-width="2.5"/>
  <text x="262" y="300" fill="#9ca3af" font-size="11" text-anchor="end">image plane</text>
  <line x1="110" y1="190" x2="580" y2="70" stroke="#5aa9e6" stroke-width="1.5"/>
  <circle cx="580" cy="70" r="5" fill="#e6b84f"/>
  <text x="570" y="58" fill="#e6b84f" font-size="12" text-anchor="end">X = (X, Y, Z)</text>
  <circle cx="270" cy="149.1" r="4" fill="#7ee787"/>
  <text x="280" y="143.1" fill="#7ee787" font-size="12">pixel</text>
  <circle cx="270" cy="190" r="4" fill="#ef6f6c"/>
  <text x="280" y="208" fill="#ef6f6c" font-size="12">principal point</text>
  <circle cx="270" cy="60" r="3" fill="none" stroke="#c9d1d9" stroke-width="1.5"/>
  <text x="262" y="54" fill="#9ca3af" font-size="11" text-anchor="end">(0, 0)</text>
  <line x1="256" y1="60" x2="256" y2="190" stroke="#ef6f6c" stroke-width="1"/>
  <text x="252" y="129" fill="#ef6f6c" font-size="12" text-anchor="end">cy</text>
  <line x1="110" y1="224" x2="270" y2="224" stroke="#9ca3af" stroke-width="1"/>
  <text x="190" y="240" fill="#9ca3af" font-size="12" text-anchor="middle">f (pixels)</text>
  <circle cx="110" cy="190" r="6" fill="#5aa9e6"/>
  <text x="70" y="214" fill="#5aa9e6">camera centre</text>
  <text x="330" y="252" fill="#c9d1d9" font-size="13">u = f · X / Z + cx</text>
  <text x="330" y="272" fill="#c9d1d9" font-size="13">v = f · Y / Z + cy</text>
  <text x="330" y="294" fill="#9ca3af" font-size="12">K = [[f, 0, cx], [0, f, cy], [0, 0, 1]]</text>
</svg>
