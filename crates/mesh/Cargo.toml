[package]
name = "mesh"
version = "0.1.0"
edition = "2021"
description = "Screened Poisson surface reconstruction compiled to WebAssembly"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
nalgebra = "0.33"
poisson_reconstruction = { path = "vendor/poisson_reconstruction" }
# NOTE: the optimized release profile (opt-level 3 / fat LTO / codegen-units 1) lives in
# the workspace root manifest (crates/Cargo.toml) — Cargo ignores [profile.*] in member
# crates. It already applies to this crate and the vendored solver.
