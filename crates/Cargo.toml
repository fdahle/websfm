# Cargo workspace for all Rust -> WASM crates.
# Add new crates under crates/<name>/ and list them here.
[workspace]
resolver = "2"
members = ["sift", "matching", "reconstruction"]

# Profiles must live in the workspace root manifest (Cargo ignores them in
# member crates). These apply to every crate in the workspace.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
