name: Verify
# Files that are not part of the app don't run the tests (nor deploy dev). CHANGELOG.md,
# src/guide/ and src/glossary/ are built into the app, so they still do. A version tag
# always runs: path filters do not apply to tag pushes.
#
# The browser tests (about 20 min) run for a version tag, a pull request, by hand
# (Actions ▸ Verify ▸ Run workflow), and every night on main when it has new commits —
# not for a push to main: dev.websfm.app is deployed as soon as the fast checks pass, the
# nightly run shows within a day what they cannot see, and a release is held to the full
# suite. Run it by hand on main before `npm run release`, so a failure shows before the
# tag exists. The fast checks are separate jobs, so a push waits for the slowest of them.
on:
  workflow_dispatch:
  # 02:00 UTC (03:00 in Germany in winter): the full suite on main (`fresh` below
  # skips a night without commits). GitHub mails the repository owner when it fails.
  schedule:
    - cron: '0 2 * * *'
  push:
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'SECURITY.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'SECURITY.md'
      - 'docs/**'
permissions:
  contents: read
# A newer push cancels the run before it on the same ref; the nightly run is its own
# group, so a push at night does not cancel it.
concurrency:
  group: verify-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true
jobs:
  # The jobs start together, and the browser tests are split over three runners per
  # browser (Playwright --shard): a run waits for the slowest of them, not their sum.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck # TypeScript, Vue template bindings, ESLint
      - run: npm run format:check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:wasm
      - run: npm run test:wasm

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # The exports opened by the tools users open them in (scripts/interop/check.mjs): GDAL's
  # COG validator on the DEM and ortho, PDAL on the LAS / LAZ / COPC, COLMAP's bundle
  # adjuster on the COLMAP model. GDAL and PDAL run from pinned Docker images.
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends colmap
      - run: node scripts/interop/check.mjs interop-out
        env:
          COLMAP_BIN: colmap
          QT_QPA_PLATFORM: offscreen

  # The nightly run tests only a main that changed since the night before.
  fresh:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.age.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: age
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          echo "Last commit on main: $(( age / 3600 )) h ago"
          echo "changed=$([ "$age" -lt 90000 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Most of cargo test's time is compiling the dependencies; cached between runs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - run: cargo test --manifest-path crates/Cargo.toml --workspace --release --locked
      # The crates listed in the third-party notices are the ones Cargo.lock builds.
      - run: node scripts/licenses/cargo.mjs --check

  # Lints and advisories that report without gating the deploy: a new clippy lint or a
  # fresh advisory in a dependency should be seen and fixed, not hold a release.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - run: rustup component add clippy
      - run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file crates/Cargo.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Only what ships: the production dependencies.
      - run: npm audit --omit=dev --audit-level=high

  browser:
    needs: [fresh]
    # Runs after `fresh`, which only the nightly run has (skipped otherwise).
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'schedule' && needs.fresh.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # WebKit is Safari's engine: Playwright's Linux build has no WebGPU and no
        # MediaRecorder, so it stands in for Safari's code paths, not for its features.
        project: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each browser is cached per lockfile (it follows the Playwright version); the
      # system libraries it needs are installed either way.
      - id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.project }}
      # Firefox finds no GL driver headless on a runner without a GPU, so it runs headed
      # in Xvfb, drawing WebGL with Mesa's software GL (llvmpipe).
      - if: matrix.project == 'firefox'
        run: sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0
      # The tests run against the dev server (playwright.config.js), so no build here.
      - if: matrix.project != 'firefox'
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3
      - if: matrix.project == 'firefox'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' npx playwright test --project=firefox --shard=${{ matrix.shard }}/3
        env:
          PW_HEADED: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # After the tests pass: a push to main deploys dev.websfm.app (after checks and rust;
  # the browser job is skipped there), a version tag (v0.5.0, from `npm run release`)
  # deploys websfm.app after all three (docs/deployment.md ▸ Cloudflare).
  # The R2 files (models, ORT's WebGPU wasm) are not uploaded here: run
  # `deploy-cloudflare.mjs --upload` by hand after a model or ORT change.
  deploy:
    needs: [lint, unit, build, rust, interop, browser]
    # A skipped job would skip this one too, so the results are tested by hand: a tag
    # needs the browser tests to have passed, main only that they did not fail.
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.lint.result == 'success' && needs.unit.result == 'success' &&
      needs.build.result == 'success' && needs.rust.result == 'success' &&
      needs.interop.result == 'success' &&
      ((github.ref == 'refs/heads/main' && needs.browser.result == 'skipped') ||
       (startsWith(github.ref, 'refs/tags/v') && needs.browser.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev' }}
      url: ${{ startsWith(github.ref, 'refs/tags/v') && 'https://websfm.app' || 'https://dev.websfm.app' }}
    # One deploy per site at a time; a newer push waits rather than cancels it.
    concurrency:
      group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev' }}
      cancel-in-progress: false
    # contents: write lets a tag's run publish its GitHub release (the last step).
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The tag is the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # build:release checks every redistributable model is in dist/ (the large ones
      # are then served from R2), so the weights are fetched; cached between runs.
      - uses: actions/cache@v6
        with:
          path: |
            public/models
            public/examples
          key: deploy-assets-${{ hashFiles('src/core/models/registry.js', 'scripts/fetch-models.mjs', 'src/core/examples.js', 'scripts/fetch-examples.mjs') }}
      - run: npm run fetch:models && npm run fetch:examples && npm run build:release
      - name: Deploy
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then node scripts/deploy-cloudflare.mjs
          else node scripts/deploy-cloudflare.mjs --env dev; fi
      # After websfm.app is live: the GitHub release of the tag, its notes the version's
      # CHANGELOG section (scripts/release-notes.mjs), marked as the latest release.
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "WebSfM ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
